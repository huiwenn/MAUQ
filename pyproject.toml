[project]
name = "topology-tax"
version = "0.1.0"
description = "The Topology Tax: Quantifying How Agent Communication Structure Amplifies or Absorbs Uncertainty"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "datasets>=2.16.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "shap>=0.44.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
